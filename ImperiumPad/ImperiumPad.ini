; ImperiumPad.ini - impostazioni della mod (va nella cartella del gioco, accanto a gbr.exe)
; Versione 0.10.3. Quasi tutto si cambia anche nel gioco: tieni View (aiuto) e premi Menu (impostazioni).
; Schema completo dei comandi in docs/ImperiumPad_controller.md.

[General]
; lingua dei testi a schermo: Auto = quella del gioco (Settings.ini), oppure Italian, English, Spanish
Language=Auto

[Pad]
; Auto = controller XInput (sotto Steam lo Steam Controller e il DualSense arrivano cosi')
; Keyboard = pad simulato con il tastierino numerico, Laptop = pad simulato con le lettere (portatili),
; acceso all'avvio; il Bloc Num o il Bloc Maiusc lo spengono (le lettere vanno al gioco: tasti rapidi della barra)
; e lo riaccendono. A ogni cambio un suono (normale = acceso, di avviso = spento) e un riquadro in alto a sinistra
Source=Auto
; simboli sulla barra comandi e nomi dei tasti nell'aiuto: Steam, Xbox o PlayStation
; (nel gioco: tenendo View, freccia sinistra/destra li cambia e li salva qui)
Glyphs=Steam
; 1 = col pad attivo le lettere della tastiera che Imperivm Resurrected scrive sui pulsanti della barra spariscono
; (restano i simboli del pad); col pad spento ricompaiono. Provato con Resurrected 1.0.3; le versioni nuove si cercano
; nel loro codice, se non si trova nulla le lettere restano
HideKeyLetters=1
; simboli del pad sui pulsanti della barra comandi (e del menu senza selezione): Hold = compaiono tenendo RT, che e' il
; tasto che li fa partire (accanto alla barra resta il simbolo di RT); Always = sempre, piu' chiari con RT tenuto
BarSymbols=Hold
; dimensione di simboli, radiali, cursore e pannelli (0.8 = piccola, 1 = normale, 1.25 = grande, 1.5 = molto grande)
UiScale=1.0
; forza della vibrazione del controller (0 = spenta, 0.5 = leggera, 1 = forte): breve a ogni avviso nuovo, doppia quando
; l'eroe selezionato scende sotto un quarto della salute
Vibration=1.0
; numero del controller XInput (0 = il primo)
ControllerIndex=0
; ogni quanti millisecondi si legge il pad
TickMs=8
; zone morte delle leve (0..1)
LeftDeadzone=0.20
RightDeadzone=0.25
; pressione piu' breve di cosi' (ms) = tocco: RB/LB eroe successivo/precedente, View pannello informazioni
TapMs=300
; 1 = scrive nel log i tasti del simulatore
KeyLog=0
; solo per le prove automatiche: 1 = il simulatore accetta anche i tasti mandati da programma
AcceptInjected=0

[Cursor]
; velocita' massima del cursore, in altezze della finestra al secondo
Speed=1.3
; curva di risposta della leva (1 = lineare, 2 = piu' preciso vicino al centro)
Curve=2.0
; accelerazione: il cursore parte al 35% della velocita' e arriva al 100% in questo tempo (ms; 0 = subito)
RampMs=300
; Auto = cursore di Windows, ma se non si sposta (gamescope sulla Steam Machine) il pad passa da solo a un cursore
; disegnato; Real = sempre quello di Windows; Virtual = sempre quello disegnato
Mode=Auto
; calamita: velocita' del cursore sopra unita', edifici, pulsanti e caselle (1 = spenta, 0.35 = forte)
Magnet=0.5
; passo della croce nei menu quando le caselle non si conoscono, frazione dell'altezza della finestra
; (dentro un elenco la croce su/giu' scorre del doppio di questo passo)
Nudge=0.012

[Camera]
; 1 = camera analogica: la leva destra sposta la mappa piu' o meno veloce secondo quanto e' inclinata, in ogni direzione
; (0 = come prima, frecce del gioco a velocita' fissa)
Analog=1
; velocita' con la leva tutta inclinata, rispetto a quella delle frecce del gioco (1 = uguale)
Speed=1.0
; curva di risposta della leva destra (1 = lineare, piu' alto = piu' preciso vicino al centro)
Curve=1.6
; frecce (Analog=0) e menu: inclinazione oltre la quale la leva destra conta (0..1)
Threshold=0.50

[Radial]
; velocita' della partita mentre un radiale e' aperto, solo in partita singola (1 = tempo normale, 0.35 = rallentato)
SlowMotion=0.35

[Buttons]
; tasti riassegnabili: tasto fisico = tasto che deve fare (anche nel gioco: impostazioni, "Tasti del controller"). Nomi: A B X Y LB RB View Menu L3 R3 Up Down Left Right.
; Esempio per scambiare A e B (come sulle console giapponesi):
;A=B
;B=A

[Input]
; 1 = Maiusc virtuale del pad (LT) visto dal gioco e da Imperivm Resurrected
VirtualModifiers=1

[Diag]
; ogni quanti millisecondi il log controlla finestra e stato del gioco
IntervalMs=1000
; 1 = legge in sola lettura alcuni indirizzi del gioco (modalita' mappa o menu, selezione, comando in attesa)
Memory=1
